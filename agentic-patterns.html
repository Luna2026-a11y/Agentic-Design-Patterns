<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#7c4dff;--primary-light:#b388ff;--accent:#00e5ff;--bg:#0d0d1a;--surface:#1a1a2e;--correct:#00e676;--wrong:#ff5252;--gold:#ffd740}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#e0e0e0;font-family:'Fredoka',sans-serif;min-height:100dvh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 0%,rgba(124,77,255,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(0,229,255,.08) 0%,transparent 50%)}
.app{max-width:640px;margin:0 auto;padding:48px 20px 60px;position:relative;z-index:1}.screen{display:none}.screen.active{display:block}
.nav-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--primary-light);font-family:'Fredoka',sans-serif;font-size:.88rem;font-weight:600;margin-bottom:16px;padding:0;transition:color .2s}.nav-back:hover{color:var(--accent)}
.home-header{text-align:center;margin-bottom:28px}.home-icon{font-size:3.5rem;display:block;margin-bottom:4px;animation:iF 3s ease-in-out infinite}@keyframes iF{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.home-title{font-family:'Baloo 2',sans-serif;font-size:1.9rem;font-weight:800;background:linear-gradient(135deg,#7c4dff,#00e5ff,#b388ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-subtitle{font-size:.85rem;color:#8c8ca0;margin-top:4px}
.badges-row{display:flex;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}.badge-item{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.25;transition:opacity .3s,transform .3s}.badge-item.earned{opacity:1;transform:scale(1.06)}
.badge-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.3);background:linear-gradient(135deg,#7c4dff,#b388ff)}.badge-label{font-size:.55rem;font-weight:600;color:#8c8ca0;text-align:center;line-height:1.2}
.gpbar-wrap{background:var(--surface);border-radius:16px;padding:14px 20px;margin-bottom:22px;border:1px solid rgba(124,77,255,.2)}.gpbar-label{display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:#8c8ca0;margin-bottom:8px}
.gpbar-bg{height:10px;background:rgba(124,77,255,.15);border-radius:99px;overflow:hidden}.gpbar-fill{height:100%;background:linear-gradient(90deg,#7c4dff,#00e5ff);border-radius:99px;transition:width .6s ease}
.levels-grid{display:grid;gap:13px}.level-card{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:20px;padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.2);border:2px solid rgba(124,77,255,.15);transition:all .25s ease}
.level-card:not(.locked):not(.soon){cursor:pointer}.level-card:not(.locked):not(.soon):hover{border-color:var(--primary-light);transform:translateY(-2px);box-shadow:0 4px 20px rgba(124,77,255,.25)}
.level-card.locked{opacity:.45;filter:grayscale(.5)}.level-card.soon{opacity:.55;filter:grayscale(.3)}
.lv-num{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-size:.9rem;font-weight:800;background:linear-gradient(135deg,#7c4dff,#b388ff);color:#fff}
.level-card.completed .lv-num{background:linear-gradient(135deg,#00c853,#69f0ae)}
.lv-info{flex:1;min-width:0}.lv-title{font-weight:700;font-size:.9rem;color:#fff}.lv-desc{font-size:.75rem;color:#8c8ca0;margin-top:2px}.lv-stars{margin-top:3px;font-size:.8rem}.lv-status{font-size:1.2rem;flex-shrink:0}
.course-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.lvl-tag{display:inline-block;color:#fff;padding:4px 12px;border-radius:99px;font-size:.72rem;font-weight:700;background:linear-gradient(135deg,#7c4dff,#b388ff)}
.c-title{font-family:'Baloo 2',sans-serif;font-size:1.3rem;font-weight:800;color:#fff}
.lesson-card{background:rgba(255,255,255,.05);border:1px solid rgba(124,77,255,.15);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.lesson-card h3{font-family:'Baloo 2',sans-serif;font-size:1.05rem;color:var(--accent);margin-bottom:8px}
.lesson-card h4{font-family:'Baloo 2',sans-serif;font-size:.92rem;color:var(--primary-light);margin:10px 0 6px}
.lesson-card p{font-size:.86rem;line-height:1.6;margin-bottom:8px}.lesson-card strong{color:var(--gold)}.lesson-card em{color:var(--primary-light)}
.lesson-card ul,.lesson-card ol{font-size:.86rem;padding-left:20px;margin-bottom:8px}.lesson-card li{margin-bottom:4px}
.lesson-card code{background:rgba(124,77,255,.2);padding:2px 6px;border-radius:4px;font-size:.78rem;color:var(--accent)}
.lesson-card pre{background:rgba(0,0,0,.4);padding:14px;border-radius:10px;overflow-x:auto;font-size:.78rem;color:#b0bec5;margin:10px 0}.lesson-card pre code{background:none;padding:0}
.tip{background:rgba(0,229,255,.08);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.83rem;margin:10px 0}.tip strong{color:var(--accent)}
.char-bubble{display:flex;align-items:flex-start;gap:14px;background:var(--surface);border-radius:16px;padding:16px;margin:16px 0;border:1px solid rgba(0,229,255,.15)}.bubble-text{font-size:.85rem;line-height:1.5;color:#ccc}
.btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-purple{background:linear-gradient(135deg,#7c4dff,#5e35b1);color:#fff;border:none;padding:14px 28px;border-radius:14px;font-family:'Fredoka',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(124,77,255,.3)}.btn-purple:hover{transform:translateY(-2px)}
.btn-cyan{background:linear-gradient(135deg,#00e5ff,#00b8d4);color:#0d0d1a;border:none;padding:14px 28px;border-radius:14px;font-family:'Fredoka',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(0,229,255,.3)}.btn-cyan:hover{transform:translateY(-2px)}
.btn-green{background:linear-gradient(135deg,#00c853,#69f0ae);color:#0d0d1a;border:none;padding:14px 28px;border-radius:14px;font-family:'Fredoka',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(0,200,83,.3)}.btn-green:hover{transform:translateY(-2px)}
.btn-ghost{background:none;color:#8c8ca0;border:1px solid rgba(255,255,255,.1);padding:12px 22px;border-radius:14px;font-family:'Fredoka',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.btn-ghost:hover{border-color:rgba(255,255,255,.3);color:#fff}
.quiz-card{background:var(--surface);border-radius:20px;padding:24px;border:1px solid rgba(124,77,255,.15);margin-bottom:16px}.quiz-q{font-family:'Baloo 2',sans-serif;font-size:1.05rem;color:#fff;margin-bottom:16px;line-height:1.5}
.quiz-opts{display:grid;gap:10px}.quiz-opt{background:rgba(124,77,255,.1);border:2px solid rgba(124,77,255,.2);border-radius:12px;padding:14px 18px;cursor:pointer;font-size:.88rem;color:#e0e0e0;transition:all .2s;text-align:left}.quiz-opt:hover:not(.disabled){border-color:var(--primary-light);background:rgba(124,77,255,.2)}
.quiz-opt.correct{border-color:var(--correct);background:rgba(0,230,118,.15);color:#69f0ae}.quiz-opt.wrong{border-color:var(--wrong);background:rgba(255,82,82,.15);color:#ff8a80}.quiz-opt.disabled{cursor:default;opacity:.7}
.quiz-fb{margin-top:14px;padding:14px;border-radius:12px;font-size:.86rem;line-height:1.5}.quiz-fb.ok{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#69f0ae}.quiz-fb.err{background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);color:#ff8a80}
.quiz-progress{display:flex;gap:6px;justify-content:center;margin-bottom:16px}.qdot{width:12px;height:12px;border-radius:50%;background:rgba(124,77,255,.2);transition:all .3s}.qdot.cur{background:var(--accent);transform:scale(1.3)}.qdot.ok{background:var(--correct)}.qdot.err{background:var(--wrong)}
.vf-opts{display:flex;gap:12px}.vf-opt{flex:1;padding:14px;text-align:center;cursor:pointer;background:rgba(124,77,255,.1);border:2px solid rgba(124,77,255,.2);border-radius:12px;font-size:1rem;font-weight:700;color:#e0e0e0;transition:all .2s}.vf-opt:hover:not(.disabled){border-color:var(--primary-light);background:rgba(124,77,255,.2)}
.vf-opt.correct{border-color:var(--correct);background:rgba(0,230,118,.15);color:#69f0ae}.vf-opt.wrong{border-color:var(--wrong);background:rgba(255,82,82,.15);color:#ff8a80}.vf-opt.disabled{cursor:default;opacity:.7}
.res-box{text-align:center;padding:28px 20px}.res-score{font-family:'Baloo 2',sans-serif;font-size:3rem;font-weight:800;background:linear-gradient(135deg,#7c4dff,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.res-sub{font-size:.9rem;color:#8c8ca0;margin-top:4px}.res-msg{margin:18px 0;padding:16px;border-radius:14px;font-size:.95rem;line-height:1.6}
.res-msg.unlock{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);color:#69f0ae}.res-msg.retry{background:rgba(255,152,0,.08);border:1px solid rgba(255,152,0,.2);color:#ffcc80}
.res-stars{font-size:2rem;margin:12px 0}.res-stars span{margin:0 2px}
.badge-notif{background:linear-gradient(135deg,rgba(255,215,64,.1),rgba(124,77,255,.1));border:2px solid var(--gold);border-radius:16px;padding:16px;text-align:center;margin:16px 0;display:none}.badge-notif.show{display:block}.badge-notif h3{color:var(--gold);font-family:'Baloo 2',sans-serif;margin-bottom:4px}.badge-notif p{font-size:.85rem;color:#ccc}
.confetti-piece{position:fixed;z-index:9999;pointer-events:none;animation:cF linear forwards}@keyframes cF{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>

<body>
<div class="app">
<div class="screen active" id="sHome">
<div class="home-header"><span class="home-icon">🤖</span><div class="home-title">Agentic Design Patterns</div><div class="home-subtitle">Cours interactif — 21 chapitres, montez en niveau !</div></div>
<div class="badges-row" id="badgesRow"></div>
<div class="gpbar-wrap"><div class="gpbar-label"><span>Progression</span><span id="gpCount">0 / 105</span></div><div class="gpbar-bg"><div class="gpbar-fill" id="gpFill" style="width:0%"></div></div></div>

<div class="course-header"><span class="lvl-tag" id="cLvlTag"></span><div class="c-title" id="cTitle"></div></div>
<div id="courseContent"></div>
<div class="char-bubble"><div style="font-size:2.5rem">🤖</div><div class="bubble-text" id="bubbleCourse"></div></div>

</div>

</div>

</div>
</div>
<script>

const LS_KEY="agentic_patterns_course_v2",N_Q=5,UNLOCK=0.8;

const BADGES=[{"id": "ch1", "icon": "\ud83d\udd17", "label": "Ch.1 Chaineur", "min": 4}, {"id": "ch2", "icon": "\ud83d\udd00", "label": "Ch.2 Routeur", "min": 8}, {"id": "ch3", "icon": "\u26a1", "label": "Ch.3 Parall\u00e9liseur", "min": 12}, {"id": "ch5", "icon": "\ud83d\udee0\ufe0f", "label": "Ch.5 Outils", "min": 20}, {"id": "ch7", "icon": "\ud83e\udd1d", "label": "Ch.7 Multi-Agent", "min": 35}, {"id": "ch10", "icon": "\ud83d\udd0c", "label": "Ch.10 MCP", "min": 50}, {"id": "ch14", "icon": "\ud83d\udcda", "label": "Ch.14 RAG", "min": 65}, {"id": "all", "icon": "\ud83c\udfc6", "label": "Master", "min": 100}];

const LEVELS=[{"title": "Ch.1 — Chaînage de Prompts", "desc": "Décomposer les tâches complexes en étapes séquentielles", "icon": "🔗", "soon": false}, {"title": "Ch.2 — Routage", "desc": "Aiguiller dynamiquement vers le bon traitement", "icon": "🔀", "soon": false}, {"title": "Ch.3 — Parallélisation", "desc": "Exécuter des tâches indépendantes en même temps", "icon": "⚡", "soon": false}, {"title": "Ch.4 — Réflexion", "desc": "Auto-évaluation et amélioration de l'agent", "icon": "🪞", "soon": true}, {"title": "Ch.5 — Utilisation d'outils", "desc": "Connecter l'agent à des APIs et services externes", "icon": "🛠️", "soon": true}, {"title": "Ch.6 — Planification", "desc": "Stratégies de planification pour agents autonomes", "icon": "📋", "soon": true}, {"title": "Ch.7 — Multi-Agent", "desc": "Systèmes multi-agents collaboratifs", "icon": "🤝", "soon": true}, {"title": "Ch.8 — Mémoire", "desc": "Gérer l'état et l'historique de conversation", "icon": "💾", "soon": true}, {"title": "Ch.9 — Apprentissage", "desc": "Adaptation et amélioration continue", "icon": "📈", "soon": true}, {"title": "Ch.10 — MCP", "desc": "Model Context Protocol pour l'interopérabilité", "icon": "🔌", "soon": true}, {"title": "Ch.11 — Définition d'objectifs", "desc": "Comment les agents se fixent des buts", "icon": "🎯", "soon": true}, {"title": "Ch.12 — Gestion des exceptions", "desc": "Récupération gracieuse après les erreurs", "icon": "⚠️", "soon": true}, {"title": "Ch.13 — Humain dans la boucle", "desc": "Supervision humaine des décisions critiques", "icon": "👤", "soon": true}, {"title": "Ch.14 — RAG", "desc": "Génération augmentée par la recherche", "icon": "📚", "soon": true}, {"title": "Ch.15 — A2A", "desc": "Communication inter-agents", "icon": "🗣️", "soon": true}, {"title": "Ch.16 — Optimisation des ressources", "desc": "Efficacité des systèmes agentiques", "icon": "🔋", "soon": true}, {"title": "Ch.17 — Raisonnement", "desc": "Techniques avancées de raisonnement", "icon": "🧠", "soon": true}, {"title": "Ch.18 — Garde-fous", "desc": "Sécurité et contraintes", "icon": "🛡️", "soon": true}, {"title": "Ch.19 — Évaluation", "desc": "Benchmarking la performance des agents", "icon": "📊", "soon": true}, {"title": "Ch.20 — Prioritisation", "desc": "Comment les agents priorisent leurs actions", "icon": "🏷️", "soon": true}, {"title": "Ch.21 — Exploration", "desc": "Apprentissage par exploration et découverte", "icon": "🔭", "soon": true}];

const LESSONS=["<div class=\"lesson-card\"><h3>🔍 Vue d'ensemble du Chaînage de Prompts</h3>\n<p>Le <strong>chaînage de prompts</strong> (aussi appelé <strong>pattern Pipeline</strong>) est un paradigme fondamental pour traiter des tâches complexes avec un LLM.</p>\n<p><strong>Principe :</strong> au lieu de demander au modèle de tout résoudre en un seul appel monolithique, on <strong>décompose le problème en une séquence de sous-problèmes</strong> plus simples. Chaque sous-problème est traité par un prompt dédié, et la sortie d'un prompt sert d'entrée au suivant.</p>\n<p>Cette approche introduit :</p>\n<ul><li><strong>Modularité</strong> — chaque étape est indépendante et focalisée</li>\n<li><strong>Clarté</strong> — plus facile à comprendre et déboguer</li>\n<li><strong>Robustesse</strong> — chaque étape est optimisée pour une tâche spécifique</li></ul>\n<div class=\"tip\">💡 <strong>Clé :</strong> La sortie d'une étape alimente l'entrée de la suivante — c'est la <strong>chaîne de dépendance</strong>. Le contexte et les résultats précédents guident le traitement suivant.</div>\n<p>Le chaînage permet aussi d'<strong>intégrer des outils externes</strong> à chaque étape (APIs, bases de données), enrichissant les capacités du LLM au-delà de son entraînement. C'est un pattern <strong>fondateur pour les systèmes agentiques</strong>.</p>\n</div>\n\n<div class=\"lesson-card\"><h3>⚠️ Les limites d'un seul prompt</h3>\n<p>Utiliser un seul prompt complexe pour une tâche multifacette entraîne :</p>\n<ul><li><strong>Négligence d'instructions</strong> — le modèle oublie certaines parties du prompt</li>\n<li><strong>Dérive contextuelle</strong> — le modèle perd le fil du contexte initial</li>\n<li><strong>Propagation d'erreurs</strong> — une erreur au début s'amplifie dans la suite</li>\n<li><strong>Charge cognitive excessive</strong> — la probabilité d'hallucination augmente</li>\n<li><strong>Fenêtre de contexte insuffisante</strong> — le modèle manque d'information pour répondre</li></ul>\n<div class=\"tip\">❌ <strong>Exemple :</strong> Demander « Analyse ce rapport, résume, identifie les tendances avec chiffres, et rédige un email » risque d'échouer car le modèle peut bien résumer mais rater le reste.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>✅ Décomposition séquentielle</h3>\n<p>Avec le chaînage, la même tâche devient :</p>\n<ol><li><strong>Prompt 1 — Résumé :</strong> « Résume les résultats clés du rapport. » <em>Rôle : Analyste de Marché</em></li>\n<li><strong>Prompt 2 — Tendances :</strong> « À partir du résumé, identifie les 3 tendances et extrais les données chiffrées. » <em>Rôle : Analyste Commercial</em></li>\n<li><strong>Prompt 3 — Email :</strong> « Rédige un email concis pour l'équipe marketing. » <em>Rôle : Rédacteur Expert</em></li></ol>\n<p><strong>Avantages :</strong></p>\n<ul><li>Chaque étape est plus simple → moins de charge cognitive → plus de précision</li>\n<li>On peut assigner un <strong>rôle distinct</strong> au modèle à chaque étape</li>\n<li>Contrôle plus granulaire sur chaque sous-tâche</li></ul>\n<div class=\"tip\">🏗️ <strong>Analogie :</strong> Comme un pipeline de fonctions — chaque fonction fait une opération spécifique avant de passer son résultat à la suivante.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>📋 Sortie structurée (JSON)</h3>\n<p>La fiabilité d'une chaîne dépend de <strong>l'intégrité des données transmises</strong> entre les étapes. Si la sortie est ambiguë, l'étape suivante risque d'échouer.</p>\n<p><strong>Solution :</strong> Spécifier un format de sortie structuré — <strong>JSON</strong> ou XML.</p>\n<pre><code>{\n  \"trends\": [\n    { \"trend_name\": \"Personnalisation IA\",\n      \"supporting_data\": \"73% des consommateurs...\" }\n  ]\n}</code></pre>\n<div class=\"tip\">🎯 Le JSON est lisible par machine, parsable sans ambiguïté, et insérable précisément dans le prompt suivant. Cela minimise les erreurs d'interprétation du langage naturel.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>🎯 7 cas d'usage pratiques</h3>\n<h4>1. Traitement d'information</h4>\n<p>Extraire → Résumer → Identifier les entités → Chercher en base → Générer un rapport</p>\n<h4>2. Réponse à requêtes complexes</h4>\n<p>Identifier les sous-questions → Rechercher pour chacune → Synthétiser en une réponse cohérente</p>\n<h4>3. Extraction et transformation de données</h4>\n<p>Extraire les champs → Valider → Compléter si manquant → Fournir en JSON. Pour l'OCR : extraction → normalisation (\"mille cinquante\" → 1050) → calcul via outil externe.</p>\n<h4>4. Génération de contenu</h4>\n<p>Idées → Plan détaillé → Rédaction section par section → Révision finale</p>\n<h4>5. Agents conversationnels avec état</h4>\n<p>Traiter l'énoncé → Identifier intent + entités → Mettre à jour l'état → Répondre → Répéter en accumulant l'historique</p>\n<h4>6. Génération et amélioration de code</h4>\n<p>Comprendre → Pseudocode → Code initial → Identifier erreurs → Améliorer → Documentation + tests</p>\n<div class=\"tip\">🔧 On peut insérer de la <strong>logique déterministe</strong> entre les appels au modèle — validation, traitement, branchement conditionnel.</div>\n<h4>7. Raisonnement multimodal</h4>\n<p>Extraire le texte de l'image → Relier aux étiquettes → Interpréter avec les données tabulaires</p>\n</div>\n\n<div class=\"lesson-card\"><h3>💻 Exemple de code — LangChain avec LCEL</h3>\n<p>LangChain Expression Language (LCEL) permet de chaîner avec le pipe <code>|</code>, comme un pipeline Unix :</p>\n<pre><code>from langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\n\nllm = ChatOpenAI(temperature=0)\n\nprompt_extract = ChatPromptTemplate.from_template(\n  \"Extrais les specs techniques : {text_input}\"\n)\nprompt_transform = ChatPromptTemplate.from_template(\n  \"Transforme en JSON (cpu, memory, storage) : {specifications}\"\n)\n\nextraction_chain = prompt_extract | llm | StrOutputParser()\n\nfull_chain = (\n  {\"specifications\": extraction_chain}\n  | prompt_transform | llm | StrOutputParser()\n)\n\nresult = full_chain.invoke({\n  \"text_input\": \"3.5 GHz octo-core, 16GB RAM, 1TB NVMe SSD\"\n})</code></pre>\n<div class=\"tip\">📌 La sortie de <code>extraction_chain</code> est automatiquement injectée dans <code>prompt_transform</code> via la variable <code>specifications</code>.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>🧠 Context Engineering vs Prompt Engineering</h3>\n<p><strong>Prompt Engineering</strong> = optimiser la formulation de la requête.</p>\n<p><strong>Context Engineering</strong> = construire un <strong>environnement informationnel complet</strong> pour le modèle. Inclut :</p>\n<ul><li><strong>System prompt</strong> — instructions fondamentales (« Tu es un rédacteur technique, ton ton est formel »)</li>\n<li><strong>Documents récupérés</strong> — le modèle cherche des infos dans une base de connaissances</li>\n<li><strong>Sorties d'outils</strong> — résultats d'appels à des APIs (ex: disponibilité calendrier)</li>\n<li><strong>Données implicites</strong> — identité utilisateur, historique, état environnemental</li></ul>\n<div class=\"tip\">🎯 <strong>Exemple :</strong> Un agent avec Context Engineering, pour proposer un rendez-vous, intègre : disponibilité du calendrier (outil), relation professionnelle (implicite), notes des réunions précédentes (documents).</div>\n<p><strong>Le principe :</strong> même les modèles avancés sous-performent avec un contexte limité. Ce n'est pas juste « répondre à une question », c'est <strong>construire un tableau opérationnel complet</strong> pour l'agent.</p>\n<p>Le volet « engineering » inclut :</p>\n<ul><li>Créer des <strong>pipelines robustes</strong> pour récupérer et transformer les données</li>\n<li>Établir des <strong>boucles de rétroaction</strong> pour améliorer la qualité du contexte</li>\n<li>Utiliser des outils comme <strong>Vertex AI Prompt Optimizer</strong></li></ul>\n</div>\n\n<div class=\"lesson-card\"><h3>📝 À retenir</h3>\n<ul><li><strong>Quoi :</strong> Les tâches complexes submergent les LLM en un seul prompt → négligence d'instructions, dérive contextuelle, hallucinations</li>\n<li><strong>Pourquoi :</strong> Le chaînage décompose en sous-tâches focalisées avec sortie structurée, améliorant fiabilité et contrôle</li>\n<li><strong>Quand :</strong> Tâche trop complexe pour un seul prompt, étapes distinctes, intégration d'outils, systèmes agentiques multi-étapes</li>\n<li><strong>Outils :</strong> LangChain/LangGraph, Crew AI, Google ADK</li>\n<li><strong>Context Engineering &gt; Prompt Engineering</strong> — la différence entre un chatbot basique et un système agentique sophistiqué</li></ul>\n</div>\n", "<div class=\"lesson-card\"><h3>🔀 Vue d’ensemble du Routage</h3>\n<p>Le <strong>routage</strong> (Routing) est le pattern qui permet à un agent de <strong>choisir dynamiquement</strong> la prochaine action parmi plusieurs possibilités, en fonction du contexte, de l’entrée utilisateur ou du résultat d’une opération précédente.</p>\n<p>Alors que le chaînage de prompts (Ch.1) suit un chemin linéaire et déterministe, le routage introduit une <strong>logique conditionnelle</strong> : l’agent évalue des critères spécifiques et aiguille le flux vers la fonction, l’outil ou le sous-processus le plus adapté.</p>\n<p><strong>Exemple concret :</strong> un agent de service client peut :</p>\n<ol><li>Analyser la requête de l’utilisateur</li>\n<li>Classifier l’intention :</li></ol>\n<ul><li>Intention = <em>«suivi de commande»</em> → aiguiller vers l’agent de base de données commandes</li>\n<li>Intention = <em>«information produit»</em> → aiguiller vers l’agent catalogue</li>\n<li>Intention = <em>«support technique»</em> → aiguiller vers l’agent de dépannage ou escalader</li>\n<li>Intention = <em>incertaine</em> → aiguiller vers un sous-agent de clarification</li></ul>\n<div class=\"tip\">💡 <strong>Clé :</strong> Le routage transforme un agent statique en système <strong>adaptatif et contextuel</strong>. Il passe d’un exécuteur de séquences prédéfinies à un décideur intelligent.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>⚙️ Les quatre mécanismes de routage</h3>\n<p>Le composant central du pattern Routing est le mécanisme qui effectue l’évaluation et dirige le flux. Il existe <strong>quatre approches principales</strong> :</p>\n\n<h4>1. Routage par LLM</h4>\n<p>Le modèle de langage lui-même est prompté pour <strong>analyser l’entrée et produire un identifiant</strong> indiquant la destination. Par exemple :</p>\n<pre><code>Analyse la requête suivante et retourne uniquement\nla catégorie : ‘Commande’, ‘Info Produit’,\n‘Support Technique’ ou ‘Autre’.</code></pre>\n<p>Le système lit ensuite la sortie et aiguille en conséquence. C’est la méthode la plus <strong>flexible</strong> pour les entrées nuancées.</p>\n\n<h4>2. Routage par Embeddings</h4>\n<p>La requête est convertie en <strong>vector embedding</strong> (voir Ch.14 RAG). Cet embedding est comparé aux embeddings représentant chaque route. La requête est aiguillée vers la route dont l’embedding est le plus <strong>similaire sémantiquement</strong>.</p>\n<div class=\"tip\">💡 <strong>Avantage :</strong> Le routage par embeddings est idéal quand la décision repose sur le <strong>sens</strong> de l’entrée plutôt que sur des mots-clés exacts.</div>\n\n<h4>3. Routage par Règles</h4>\n<p>Utilise des <strong>règles prédéfinies</strong> (if-else, switch) basées sur des mots-clés, patterns ou données structurées extraites de l’entrée. Plus <strong>rapide et déterministe</strong> que le LLM, mais moins flexible face aux entrées nouvelles ou subtiles.</p>\n\n<h4>4. Routage par Modèle ML Supervisé</h4>\n<p>Un <strong>modèle discriminatif</strong> (classifieur) est fine-tuné sur un corpus de données étiquetées pour la tâche de routage. La logique de décision est encodée dans les <strong>poids appris</strong> du modèle. Contrairement au routage LLM, le modèle générateur n’est pas sollicité à l’inférence — la décision est prise par le classifieur fine-tuné.</p>\n<div class=\"tip\">💡 <strong>Distinction clé :</strong> En routage LLM, le modèle <em>génère</em> la décision à chaque appel. En routage ML, les poids appris <em>contiennent</em> déjà la logique. Les LLM peuvent toutefois servir à générer des données synthétiques pour l’entraînement du classifieur.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>📐 Points d’application du routage</h3>\n<p>Le routage peut intervenir à <strong>plusieurs moments</strong> du cycle opérationnel d’un agent :</p>\n<ul><li><strong>En entrée</strong> — pour classifier la tâche principale dès le début</li>\n<li><strong>À mi-chemin</strong> — dans une chaîne de traitement, pour déterminer l’action suivante selon les résultats intermédiaires</li>\n<li><strong>Dans une sous-routine</strong> — pour sélectionner l’outil le plus approprié parmi un ensemble disponible</li></ul>\n<p>Cette flexibilité de placement fait du routage un <strong>pattern transversal</strong>, utilisable à chaque nœud de décision dans l’architecture d’un agent.</p>\n</div>\n\n<div class=\"lesson-card\"><h3>🛠️ Frameworks : LangGraph et Google ADK</h3>\n<p>Les frameworks modernes proposent des constructions explicites pour le routage :</p>\n\n<h4>LangGraph</h4>\n<p>Architecture de <strong>graphe à états</strong>. On définit les nœuds (états), les arêtes (transitions) et les fonctions conditionnelles qui dictent les transitions. Idéal pour les <strong>scénarios de routage complexes</strong> où les décisions dépendent de l’état accumulé du système.</p>\n\n<h4>Google ADK (Agent Development Kit)</h4>\n<p>Le routage est implémenté en définissant un ensemble discret d’<strong>outils (Tools)</strong> représentant les capacités de l’agent. Le framework gère la sélection de l’outil approprié via sa <strong>logique interne</strong> (Auto-Flow), qui s’appuie sur un modèle sous-jacent. Quand un agent coordinateur a des <code>sub_agents</code> définis, l’ADK délègue automatiquement les requêtes au bon sous-agent.</p>\n<div class=\"tip\">💡 <strong>Comparaison :</strong> LangGraph = contrôle <em>explicite</em> via graphe d’états. ADK = délégation <em>automatique</em> via tools et sub_agents.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>🌍 Applications pratiques</h3>\n<p>Le routage est indispensable dans de nombreux domaines :</p>\n\n<h4>Interaction Humain-Machine</h4>\n<ul><li><strong>Assistants virtuels</strong> : interprétation de l’intention utilisateur → réponse, escalade, ou sélection du module suivant</li>\n<li><strong>Tuteurs IA</strong> : adaptation du parcours pédagogique selon la performance</li></ul>\n\n<h4>Pipelines de traitement de données</h4>\n<ul><li><strong>Tri et distribution</strong> : emails, tickets de support, payloads API analysés par contenu/métadonnées</li>\n<li><strong>Aiguillage format</strong> : JSON → transformation A, CSV → transformation B, urgent → escalade</li></ul>\n\n<h4>Systèmes multi-outils / multi-agents</h4>\n<ul><li><strong>Agent de recherche</strong> : dispatche vers agents de recherche, résumé ou analyse</li>\n<li><strong>Assistant de code</strong> : identifie le langage + intention (debug, expliquer, traduire) → aiguille vers le bon outil</li></ul>\n</div>\n\n<div class=\"lesson-card\"><h3>💻 Code : Routage avec LangChain</h3>\n<p>Cet exemple construit un coordinateur qui <strong>classe les requêtes</strong> et les délègue aux handlers spécialisés :</p>\n<pre><code>from langchain_google_genai import ChatGoogleGenerativeAI\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\nfrom langchain_core.runnables import RunnablePassthrough, RunnableBranch\n\nllm = ChatGoogleGenerativeAI(model=\"gemini-2.5-flash\", temperature=0)\n\n# --- Handlers (sous-agents simulés) ---\ndef booking_handler(request: str) -&gt; str:\n    return f\"Réservation traitée : ‘{request}’\"\n\ndef info_handler(request: str) -&gt; str:\n    return f\"Information récupérée : ‘{request}’\"\n\ndef unclear_handler(request: str) -&gt; str:\n    return f\"Requête incertaine : ‘{request}’. Merci de clarifier.\"\n\n# --- Chaîne de routage du coordinateur ---\ncoordinator_prompt = ChatPromptTemplate.from_messages([\n    (\"system\", \"\"\"Analyse la requête et détermine le handler.\n    - Réservation vol/hôtel → ‘booker’\n    - Question générale → ‘info’\n    - Sinon → ‘unclear’\n    UN seul mot en sortie : ‘booker’, ‘info’, ou ‘unclear’.\"\"\"),\n    (\"user\", \"{request}\")\n])\n\nrouter_chain = coordinator_prompt | llm | StrOutputParser()\n\n# --- Logique de délégation via RunnableBranch ---\nbranches = {\n    \"booker\": RunnablePassthrough.assign(\n        output=lambda x: booking_handler(x[\"request\"][\"request\"])),\n    \"info\": RunnablePassthrough.assign(\n        output=lambda x: info_handler(x[\"request\"][\"request\"])),\n    \"unclear\": RunnablePassthrough.assign(\n        output=lambda x: unclear_handler(x[\"request\"][\"request\"])),\n}\n\ndelegation = RunnableBranch(\n    (lambda x: x[\"decision\"].strip() == \"booker\", branches[\"booker\"]),\n    (lambda x: x[\"decision\"].strip() == \"info\", branches[\"info\"]),\n    branches[\"unclear\"]  # défaut\n)\n\ncoordinator_agent = {\n    \"decision\": router_chain,\n    \"request\": RunnablePassthrough()\n} | delegation | (lambda x: x[\"output\"])</code></pre>\n<p>Le <code>RunnableBranch</code> agit comme un <strong>switch conditionnel</strong> : il examine la sortie du routeur LLM et aiguille vers le handler correspondant.</p>\n</div>\n\n<div class=\"lesson-card\"><h3>💻 Code : Routage avec Google ADK</h3>\n<p>Avec l’ADK, le routage est <strong>automatique</strong> grâce à l’Auto-Flow quand on définit des <code>sub_agents</code> :</p>\n<pre><code>from google.adk.agents import Agent\nfrom google.adk.runners import InMemoryRunner\nfrom google.adk.tools import FunctionTool\n\n# --- Outils ---\ndef booking_handler(request: str) -&gt; str:\n    return f\"Réservation simulée : ‘{request}’\"\n\ndef info_handler(request: str) -&gt; str:\n    return f\"Info simulée : ‘{request}’\"\n\nbooking_tool = FunctionTool(booking_handler)\ninfo_tool = FunctionTool(info_handler)\n\n# --- Sous-agents spécialisés ---\nbooking_agent = Agent(\n    name=\"Booker\",\n    model=\"gemini-2.0-flash\",\n    description=\"Agent spécialisé dans les réservations.\",\n    tools=[booking_tool]\n)\n\ninfo_agent = Agent(\n    name=\"Info\",\n    model=\"gemini-2.0-flash\",\n    description=\"Agent spécialisé en information générale.\",\n    tools=[info_tool]\n)\n\n# --- Agent coordinateur ---\ncoordinator = Agent(\n    name=\"Coordinator\",\n    model=\"gemini-2.0-flash\",\n    instruction=(\n        \"Tu es le coordinateur. Analyse chaque requête et \"\n        \"délègue au bon agent. Ne réponds pas directement.\\n\"\n        \"- Réservation → agent ‘Booker’\\n\"\n        \"- Question générale → agent ‘Info’\"\n    ),\n    sub_agents=[booking_agent, info_agent]\n)\n\n# --- Exécution ---\nrunner = InMemoryRunner(coordinator)\nresult = await run_coordinator(runner, \"Réserve un vol pour Paris.\")</code></pre>\n<div class=\"tip\">💡 <strong>Auto-Flow :</strong> Dès que <code>sub_agents</code> est défini sur le coordinateur, l’ADK <strong>délègue automatiquement</strong> les requêtes au sous-agent approprié. Pas besoin de RunnableBranch explicite !</div>\n</div>\n\n<div class=\"lesson-card\"><h3>✅ Points clés à retenir</h3>\n<ul><li>Le <strong>routage</strong> permet aux agents de prendre des <strong>décisions dynamiques</strong> sur la prochaine étape d’un workflow</li>\n<li>Il permet de gérer des <strong>entrées diverses</strong> et d’adapter le comportement, au-delà de l’exécution linéaire</li>\n<li>Quatre mécanismes : <strong>LLM</strong> (flexible), <strong>Embeddings</strong> (sémantique), <strong>Règles</strong> (rapide/déterministe), <strong>ML supervisé</strong> (fine-tuné)</li>\n<li><strong>LangGraph</strong> = graphe d’états explicite, <strong>Google ADK</strong> = délégation automatique via tools/sub_agents</li>\n<li>Le pattern est essentiel pour créer des agents <strong>versatiles et robustes</strong> capables de naviguer entre scénarios variés</li></ul>\n<div class=\"tip\">🎯 <strong>Règle d’or :</strong> Utilise le routage quand un agent doit choisir entre <strong>plusieurs workflows, outils ou sous-agents distincts</strong> selon l’entrée utilisateur ou l’état courant. Indispensable pour les bots de support, les pipelines de données, et les systèmes multi-agents.</div>\n</div>", "<div class=\"lesson-card\"><h3>⚡ Vue d'ensemble de la Parallélisation</h3>\n<p>Dans les chapitres précédents, nous avons exploré le <strong>Chaînage de Prompts</strong> pour les workflows séquentiels et le <strong>Routage</strong> pour les décisions dynamiques. Mais de nombreuses tâches agentiques complexes impliquent des <strong>sous-tâches qui peuvent être exécutées simultanément</strong> plutôt qu'une par une. C'est ici que le pattern de <strong>Parallélisation</strong> devient crucial.</p>\n<p>La parallélisation consiste à <strong>exécuter plusieurs composants concurrently</strong> — appels LLM, utilisations d'outils, ou même des sous-agents entiers — au même moment (voir Fig.1). Au lieu d'attendre qu'une étape se termine avant de lancer la suivante, l'exécution parallèle permet aux tâches indépendantes de tourner en même temps, <strong>réduisant considérablement le temps d'exécution global</strong>.</p>\n<p>Considérez un agent conçu pour faire de la recherche sur un sujet :</p>\n<p><strong>Approche séquentielle :</strong></p>\n<ol><li>Rechercher la Source A</li><li>Résumer la Source A</li><li>Rechercher la Source B</li><li>Résumer la Source B</li><li>Synthétiser une réponse finale</li></ol>\n<p><strong>Approche parallèle :</strong></p>\n<ol><li>Rechercher la Source A <em>et</em> la Source B <strong>simultanément</strong></li><li>Une fois les deux recherches terminées, résumer A <em>et</em> B <strong>simultanément</strong></li><li>Synthétiser la réponse finale à partir des deux résumés (étape séquentielle attendant les étapes parallèles)</li></ol>\n<div class=\"tip\">💡 <strong>Clé :</strong> L'idée fondamentale est d'<strong>identifier les parties du workflow qui ne dépendent pas des résultats d'autres parties</strong> et de les exécuter en parallèle. C'est particulièrement efficace avec les services externes (APIs, bases de données) qui ont de la latence.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>🔧 Implémentation avec les frameworks</h3>\n<p>L'implémentation de la parallélisation nécessite des frameworks qui supportent l'<strong>exécution asynchrone</strong> ou le multi-threading. Les frameworks agentiques modernes sont conçus avec les opérations asynchrones en tête.</p>\n<p><strong>LangChain / LangGraph :</strong> Dans le LangChain Expression Language (LCEL), vous pouvez obtenir une exécution parallèle en combinant des objets <code>Runnable</code>. La primitive clé est <code>RunnableParallel</code>, qui permet de définir plusieurs runnables s'exécutant côte à côte. LangGraph, avec sa structure de graphe, permet de définir <strong>plusieurs nœuds qui peuvent être exécutés depuis une seule transition d'état</strong>, créant efficacement des branches parallèles.</p>\n<p><strong>Google ADK :</strong> Le framework ADK fournit des mécanismes natifs robustes pour la parallélisation, notamment via <code>ParallelAgent</code> et <code>SequentialAgent</code>. L'ADK facilite la conception de solutions où <strong>plusieurs agents peuvent opérer concurremment</strong>, améliorant significativement l'efficacité et la scalabilité des systèmes multi-agents.</p>\n<div class=\"tip\">⚠️ <strong>Attention :</strong> <code>asyncio</code> en Python fournit de la <strong>concurrence, pas du parallélisme réel</strong>. Il utilise un seul thread avec une boucle d'événements qui bascule entre les tâches quand l'une est en attente (ex: requête réseau). Le GIL de Python limite l'exécution parallèle réelle sur CPU.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>📋 Applications pratiques et cas d'usage</h3>\n<p>La parallélisation est un pattern puissant pour optimiser les performances des agents :</p>\n<h4>1. Collecte d'informations et recherche</h4>\n<p>Collecter des informations depuis <strong>plusieurs sources simultanément</strong> est un cas d'usage classique.</p>\n<ul><li><strong>Exemple :</strong> Un agent recherchant une entreprise peut chercher des articles d'actualités, récupérer des données boursières, vérifier les mentions sur les réseaux sociaux et interroger une base de données d'entreprise — <strong>tout en même temps</strong>.</li><li><strong>Bénéfice :</strong> Obtenir une vue complète beaucoup plus rapidement que des recherches séquentielles.</li></ul>\n<h4>2. Traitement et analyse de données</h4>\n<p>Appliquer différentes techniques d'analyse ou traiter différents segments de données concurremment.</p>\n<ul><li><strong>Exemple :</strong> Un agent analysant des retours clients peut lancer simultanément une analyse de sentiment, l'extraction de mots-clés, la catégorisation et l'identification des problèmes urgents.</li><li><strong>Bénéfice :</strong> Fournir une analyse multidimensionnelle rapidement.</li></ul>\n<h4>3. Interaction multi-API / multi-outils</h4>\n<p>Appeler plusieurs APIs indépendantes pour rassembler différents types d'informations ou effectuer différentes actions.</p>\n<ul><li><strong>Exemple :</strong> Un agent de planification de voyage vérifie les prix des vols, la disponibilité des hôtels, les événements locaux et les recommandations de restaurants <strong>concurremment</strong>.</li><li><strong>Bénéfice :</strong> Présenter un plan complet plus rapidement.</li></ul>\n<h4>4. Génération de contenu multi-composants</h4>\n<p>Générer différentes parties d'un contenu complexe en parallèle.</p>\n<ul><li><strong>Exemple :</strong> Un agent créant un e-mail marketing génère simultanément l'objet, le corps du message, une image pertinente et un texte d'appel à l'action.</li></ul>\n<h4>5. Validation et vérification</h4>\n<p>Effectuer plusieurs vérifications indépendantes concurremment.</p>\n<ul><li><strong>Exemple :</strong> Vérifier le format d'email, valider un numéro de téléphone, vérifier une adresse, et filtrer les grossièretés — <strong>tout en parallèle</strong>.</li></ul>\n<h4>6. Traitement multi-modal</h4>\n<p>Traiter différentes modalités (texte, image, audio) d'un même input concurremment.</p>\n<ul><li><strong>Exemple :</strong> Analyser le texte d'un post pour le sentiment et les mots-clés, et l'image pour les objets et la description de scène, <strong>simultanément</strong>.</li></ul>\n<h4>7. Tests A/B ou génération d'options multiples</h4>\n<p>Générer plusieurs variations d'une réponse en parallèle pour sélectionner la meilleure.</p>\n<ul><li><strong>Exemple :</strong> Générer simultanément trois titres différents pour un article avec des prompts ou modèles légèrement différents, puis comparer et sélectionner le meilleur.</li></ul>\n</div>\n\n<div class=\"lesson-card\"><h3>💻 Code : Exemple LangChain (RunnableParallel)</h3>\n<p>Voici une implémentation complète d'un workflow de traitement parallèle avec LangChain. Le workflow exécute <strong>trois opérations indépendantes concurremment</strong> en réponse à une seule requête utilisateur : résumer, générer des questions, et identifier des termes-clés.</p>\n<pre><code>import os\nimport asyncio\nfrom langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\nfrom langchain_core.runnables import (\n    Runnable, RunnableParallel,\n    RunnablePassthrough\n)\n\n# Configuration du modèle\nllm = ChatOpenAI(model="gpt-4o-mini", temperature=0.7)\n\n# --- Chaînes indépendantes ---\n\n# Chaîne 1 : Résumer le sujet\nsummarize_chain = (\n    ChatPromptTemplate.from_messages([\n        ("system", "Résume le sujet suivant de façon concise:"),\n        ("user", "{topic}")\n    ])\n    | llm\n    | StrOutputParser()\n)\n\n# Chaîne 2 : Générer des questions\nquestions_chain = (\n    ChatPromptTemplate.from_messages([\n        ("system", "Génère 3 questions intéressantes sur le sujet:"),\n        ("user", "{topic}")\n    ])\n    | llm\n    | StrOutputParser()\n)\n\n# Chaîne 3 : Identifier les termes-clés\nterms_chain = (\n    ChatPromptTemplate.from_messages([\n        ("system", "Identifie 5-10 termes clés, séparés par des virgules:"),\n        ("user", "{topic}")\n    ])\n    | llm\n    | StrOutputParser()\n)\n\n# --- Construction du bloc parallèle ---\nmap_chain = RunnableParallel(\n    {\n        "summary": summarize_chain,\n        "questions": questions_chain,\n        "key_terms": terms_chain,\n        "topic": RunnablePassthrough(),  # Passe le sujet original\n    }\n)\n\n# --- Prompt de synthèse finale ---\nsynthesis_prompt = ChatPromptTemplate.from_messages([\n    ("system", """À partir des infos suivantes :\n    Résumé : {summary}\n    Questions : {questions}\n    Termes : {key_terms}\n    Synthétise une réponse complète."""),\n    ("user", "Sujet original : {topic}")\n])\n\n# --- Chaîne complète : parallèle -> synthèse ---\nfull_chain = map_chain | synthesis_prompt | llm | StrOutputParser()\n\n# --- Exécution asynchrone ---\nasync def run-example(topic):\n    result = await full_chain.ainvoke(topic)\n    print(result)\n\nasyncio.run(run_example("L'histoire de l'exploration spatiale"))</code></pre>\n<div class=\"tip\">💡 <strong>Points clés :</strong> <code>RunnableParallel</code> exécute toutes les chaînes spécifiées <strong>conurremment</strong>. Le résultat de chaque branche alimente ensuite le prompt de synthèse. <code>RunnablePassthrough()</code> transmet l'input original sans modification.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>🌐 Code : Exemple Google ADK (ParallelAgent)</h3>\n<p>Le Google ADK offre une approche plus déclarative de la parallélisation via les agents <code>ParallelAgent</code> et <code>SequentialAgent</code>. Voici comment construire un système de recherche parallèle.</p>\n<pre><code>from google.adk.agents import (\n    LlmAgent, ParallelAgent, SequentialAgent\n)\nfrom google.adk.tools import google_search\n\n# --- 1. Définir les sous-agents chercheurs ---\n\nresearcher_1 = LlmAgent(\n    name="RenewableEnergyResearcher",\n    instruction="""Vous êtes un assistant de recherche\n    spécialisé en énergie. Recherchez les dernières avancées\n    en 'sources d'énergie renouvelable'. Résumez en 1-2 phrases.""",\n    tools=[google_search],\n    output_key="renewable_energy_result"  # Stocke dans l'état\n)\n\nresearcher_2 = LlmAgent(\n    name="EVResearcher",\n    instruction="""Vous êtes un assistant de recherche\n    spécialisé en transport. Recherchez les derniers développements\n    en 'technologie des véhicules électriques'. Résumez en 1-2 phrases.""",\n    tools=[google_search],\n    output_key="ev_technology_result"  # Stocke dans l'état\n)\n\nresearcher_3 = LlmAgent(\n    name="CarbonCaptureResearcher",\n    instruction="""Vous êtes un assistant de recherche\n    spécialisé en solutions climatiques. Recherchez l'état actuel\n    des 'méthodes de capture de carbone'. Résumez en 1-2 phrases.""",\n    tools=[google_search],\n    output_key="carbon_capture_result"  # Stocke dans l'état\n)\n\n# --- 2. Créer le ParallelAgent ---\nparallel_agent = ParallelAgent(\n    name="ParallelWebResearchAgent",\n    sub_agents=[researcher_1, researcher_2, researcher_3],\n)\n\n# --- 3. Définir l'agent de synthèse ---\nmerger_agent = LlmAgent(\n    name="SynthesisAgent",\n    instruction="""Combinez les résumés en un rapport structuré :\n    Énergie renouvelable : {renewable_energy_result}\n    Véhicules électriques : {ev_technology_result}\n    Capture de carbone : {carbon_capture_result}\n    Interdiction d'ajouter des connaissances externes.""",\n)\n\n# --- 4. Orchestrer le tout avec SequentialAgent ---\npipeline = SequentialAgent(\n    name="ResearchAndSynthesisPipeline",\n    sub_agents=[parallel_agent, merger_agent],\n)\n\nroot_agent = pipeline</code></pre>\n<div class=\"tip\">💡 <strong>Flux :</strong> Le <code>SequentialAgent</code> exécute d'abord le <code>ParallelAgent</code> (les 3 chercheurs tournent en même temps), puis une fois terminé, exécute le <code>merger_agent</code> pour synthétiser les résultats. Les <code>output_key</code> stockent les résultats dans l'état de session pour les rendre disponibles à l'agent suivant.</div>\n</div>\n\n<div class=\"lesson-card\"><h3>🎯 En résumé : le pattern Parallélisation</h3>\n<p><strong>Quoi :</strong> De nombreux workflows agentiques impliquent des sous-tâches indépendantes. L'exécution purement séquentielle est souvent inefficace et lente. La latence devient un <strong>goulot d'étranglement significatif</strong> quand les tâches dépendent d'opérations I/O externes (APIs, bases de données).</p>\n<p><strong>Pourquoi :</strong> Le pattern de Parallélisation permet l'<strong>exécution simultanée des tâches indépendantes</strong>. En identifiant les composants du workflow qui ne dépendent pas des résultats immédiats les uns des autres, on peut les lancer en même temps. Les frameworks comme LangChain et Google ADK fournissent des construits natifs pour définir et gérer ces opérations concurrentes.</p>\n<p><strong>Règle empirique :</strong> Utilisez ce pattern quand un workflow contient <strong>plusieurs opérations indépendantes</strong> pouvant tourner simultanément — comme appeler plusieurs APIs, traiter différents segments de données, ou générer plusieurs morceaux de contenu pour une synthèse ultérieure.</p>\n<ul><li><strong>✅ Avantage principal :</strong> Réduction drastique de la latence totale</li><li><strong>⚠️ Attention :</strong> La parallélisation introduit de la <strong>complexité</strong> — design, debugging et logging deviennent plus difficiles</li><li><strong>🔑 Clé :</strong> En LCEL, <code>RunnableParallel</code> est la primitive centrale ; en ADK, <code>ParallelAgent</code> orchestre les sous-agents concurrents</li><li><strong>🔗 Combinaison :</strong> La parallélisation s'intègre naturellement avec le chaînage (séquentiel) et le routage (conditionnel) pour construire des systèmes agentiques sophistiqués</li></ul>\n</div>", "<div class=\"lesson-card\" style=\"text-align:center;padding:40px 20px\"><h3 style=\"font-size:1.5rem;margin-bottom:12px\">🔒 Chapitre en cours de construction</h3><p style=\"font-size:1rem;color:#8c8ca0\">Ce chapitre sera bientôt disponible !</p><p style=\"font-size:.88rem;color:#b388ff;margin-top:12px\">En attendant, maîtrisez les chapitres précédents ! 💪</p></div>", "<div class=\"lesson-card\" style=\"text-align:center;padding:40px 20px\"><h3 style=\"font-size:1.5rem;margin-bottom:12px\">🔒 Chapitre en cours de construction</h3><p style=\"font-size:1rem;color:#8c8ca0\">Ce chapitre sera bientôt disponible !</p><p style=\"font-size:.88rem;color:#b388ff;margin-top:12px\">En attendant, maîtrisez les chapitres précédents ! 💪</p></div>", "<div class=\"lesson-card\" style=\"text-align:center;padding:40px 20px\"><h3 style=\"font-size:1.5rem;margin-bottom:12px\">🔒 Chapitre en cours de construction</h3><p style=\"font-size:1rem;color:#8c8ca0\">Ce chapitre sera bientôt disponible !</p><p style=\"font-size:.88rem;color:#b388ff;margin-top:12px\">En attendant, maîtrisez les chapitres précédents ! 💪</p></div>", "<div class=\"lesson-card\" style=\"text-align:center;padding:40px 20px\"><h3 style=\"font-size:1.5rem;margin-bottom:12px\">🔒 Chapitre en cours de construction</h3><p style=\"font-size:1rem;color:#8c8ca0\">Ce chapitre sera bientôt disponible !</p><p style=\"font-size:.88rem;color:#b388ff;margin-top:12px\">En attendant, maîtrisez les chapitres précédents ! 💪</p></div>", "<div class=\"lesson-card\" style=\"text-align:center;padding:40px 20px\"><h3 style=\"font-size:1.5rem;margin-bottom:12px\">🔒 Chapitre en cours de construction</h3><p style=\"font-size:1rem;color:#8c8ca0\">Ce chapitre sera bientôt disponible !</p><p sty const QUESTIONS=[[{"topic": "Ch.1", "question": "Quel est le principe fondamental du chaînage de prompts ?", "options": ["Utiliser un seul prompt très détaillé", "Décomposer une tâche complexe en une séquence de sous-tâches", "Toujours utiliser le modèle le plus grand possible", "Éviter les outils externes"], "correct": 1, "explain": "Le chaînage décompose un problème complexe en sous-problèmes séquentiels."}, {"topic": "Ch.1", "question": "Quel problème le chaînage résout-il ?", "options": ["Le modèle est trop lent", "Un seul prompt ne peut pas traiter une tâche complexe de manière fiable", "Il n'y a pas assez de modèles", "Les utilisateurs ne savent pas écrire de prompts"], "correct": 1, "explain": "Les tâches complexes submergent le LLM en un seul prompt."}, {"topic": "Ch.1", "type": "vf", "question": "Dans un chaînage, la sortie d'une étape devient l'entrée de la suivante.", "correct": true, "explain": "Vrai ! C'est le principe fondamental — la chaîne de dépendance."}, {"topic": "Ch.1", "question": "Pourquoi spécifier un format de sortie JSON entre les étapes ?", "options": ["Pour économiser des tokens", "Pour rendre la sortie plus jolie", "Pour garantir une sortie lisible par machine et sans ambiguïté", "Pour accélérer le traitement"], "correct": 2, "explain": "Le JSON est parsable sans ambiguïté et insérable précisément dans le prompt suivant."}, {"topic": "Ch.1", "question": "Quelle est la différence entre Prompt Engineering et Context Engineering ?", "options": ["Le Context Engineering utilise plus de tokens", "Le Context Engineering construit un environnement informationnel complet", "Ce sont la même chose", "Le Prompt Engineering est pour les petits modèles"], "correct": 1, "explain": "Le Context Engineering inclut system prompt, documents récupérés, sorties d'outils et données implicites."}], [{"topic": "Ch.2", "question": "Quelle est la différence fondamentale entre le chaînage de prompts et le routage ?", "options": ["Le chaînage est plus rapide", "Le chaînage suit un chemin linéaire fixe, le routage introduit une logique conditionnelle dynamique", "Le routage ne peut utiliser qu’un seul modèle", "Le chaînage nécessite plus de tokens"], "correct": 1, "explain": "Le chaînage est linéaire et déterministe. Le routage ajoute des conditions pour aiguiller dynamiquement vers différentes actions."}, {"topic": "Ch.2", "question": "Quel mécanisme de routage utilise la similarité sémantique entre vecteurs pour choisir la route ?", "options": ["Routage par règles", "Routage par LLM", "Routage par embeddings", "Routage par modèle ML supervisé"], "correct": 2, "explain": "Le routage par embeddings compare les vecteurs de la requête aux vecteurs des routes et choisit la plus similaire sémantiquement."}, {"topic": "Ch.2", "type": "vf", "question": "En routage par modèle ML supervisé, un LLM est utilisé en temps réel pour prendre la décision de routage à chaque inférence.", "correct": false, "explain": "Faux ! Le routage ML supervisé utilise un classifieur fine-tuné dont les poids contiennent déjà la logique. Le LLM n’est pas sollicité à l’inférence."}, {"topic": "Ch.2", "question": "Dans Google ADK, comment le coordinateur délègue-t-il automatiquement les requêtes aux sous-agents ?", "options": ["Via un RunnableBranch explicite", "Via l’Auto-Flow activé par la présence de sub_agents", "Via des règles if-else codées en dur", "Via un système d’embeddings"], "correct": 1, "explain": "L’ADK active l’Auto-Flow automatiquement quand sub_agents est défini, délégant les requêtes au sous-agent approprié."}, {"topic": "Ch.2", "type": "vf", "question": "Le routage ne peut s’appliquer qu’au début du workflow d’un agent, pour classifier la tâche principale.", "correct": false, "explain": "Faux ! Le routage peut s’appliquer en entrée, à mi-chemin dans une chaîne, ou dans une sous-routine pour sélectionner un outil."}], [
{"topic": "Ch.3", "question": "Quel est le principe fondamental du pattern de Parallélisation ?", "options": ["Exécuter toutes les tâches dans un seul appel LLM", "Exécuter plusieurs tâches indépendantes simultanément plutôt que séquentiellement", "Toujours utiliser le modèle le plus rapide disponible", "Éviter les appels API externes"], "correct": 1, "explain": "La parallélisation exécute les tâches indépendantes en même temps, réduisant la latence totale du workflow."}, {"topic": "Ch.3", "question": "Quel construct LangChain permet d'exécuter plusieurs runnables côte à côte ?", "options": ["RunnableSequence", "RunnableLambda", "RunnableParallel", "RunnableBranch"], "correct": 2, "explain": "RunnableParallel est la primitive LCEL qui exécute plusieurs runnables concurremment et agrège leurs résultats."}, {"topic": "Ch.3", "type": "vf", "question": "En Python, asyncio fournit du vrai parallélisme sur CPU grâce à l'exécution simultanée sur plusieurs cœurs.", "correct": false, "explain": "Faux ! asyncio fournit de la concurrence, pas du parallélisme réel. Il utilise un seul thread avec une boucle d'événements, limité par le GIL de Python."}, {"topic": "Ch.3", "question": "Dans l'exemple Google ADK, comment le merger_agent accède-t-il aux résultats des chercheurs parallèles ?", "options": ["Via des appels API directs entre agents", "Via les output_key qui stockent les résultats dans l'état de session", "Via une base de données partagée", "Via un système de messagerie inter-agents"], "correct": 1, "explain": "Chaque chercheur utilise output_key pour stocker son résultat dans l'état de session, que le merger_agent peut ensuite référencer dans son prompt."}, {"topic": "Ch.3", "type": "vf", "question": "La parallélisation est particulièrement efficace quand les tâches dépendent d'opérations I/O externes comme des appels API.", "correct": true, "explain": "Vrai ! Les opérations I/O ont de la latence (temps d'attente), ce qui rend la parallélisation très efficace car on peut const TOTAL_Q=N_Q*LEVELS.length;
function mkState(){const s={levels:LEVELS.map(()=>({unlocked:false,best:0,total:0})),totalOk:0,badges:[]};s.levels[0].unlocked=true;return s}
function load(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(!s||!Array.isArray(s.levels)||s.levels.length!==LEVELS.length)return mkState();return s}catch{return mkState()}}
function save(s){localStorage.setItem(LS_KEY,JSON.stringify(s))}
let curLvl=0,quizQuestions=[],quizIdx=0,quizOk=0,quizAnswered=false;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beginQuiz(){if(!QUESTIONS[curLvl]||QUESTIONS[curLvl].length===0){alert('Quiz bientôt disponible !');return}quizQuestions=shuffle([...QUESTIONS[curLvl]]);quizIdx=0;quizOk=0;quizAnswered=false;document.getElementById('qLvlTag').textContent=LEVELS[curLvl].title;document.getElementById('qTitle').textContent=LEVELS[curLvl].title;renderDots();goTo('sQuiz');renderQ()}
function renderDots(){document.getElementById('qDots').innerHTML=quizQuestions.map((_,i)=>'<div class="qdot'+(i===0?' cur':'')+'" id="qd'+i+'"></div>').join('')}
function renderQ(){const q=quizQuestions[quizIdx];quizAnswered=false;document.querySelectorAll('.qdot').forEach((d,i)=>{d.className='qdot'+(i===quizIdx?' cur':'')});let html='';if(q.type==='vf'){html='<div class="quiz-card"><div class="quiz-q">'+q.question+'</div><div class="vf-opts"><div class="vf-opt" onclick="answerVF(true)" id="opt_v">Vrai ✓</div><div class="vf-opt" onclick="answerVF(false)" id="opt_f">Faux ✗</div></div><div id="qFb"></div><div class="btn-row" id="qBtns" style="display:none;justify-content:center;margin-top:16px"><button class="btn-cyan" onclick="nextQ()" id="nxtBtn">Question suivante →</button></div></div>'}else{html='<div class="quiz-card"><div class="quiz-q">'+q.question+'</div><div class="quiz-opts">'+q.options.map((o,i)=>'<div class="quiz-opt" onclick="answerQCM('+i+')" id="opt'+i+'">'+o+'</div>').join('')+'</div><div id="qFb"></div><div class="btn-row" id="qBtns" style="display:none;justify-content:center;margin-top:16px"><button class="btn-cyan" onclick="nextQ()" id="nxtBtn">Question suivante →</button></div></div>'}document.getElementById('quizArea').innerHTML=html}
function answerQCM(idx){if(quizAnswered)return;quizAnswered=true;const q=quizQuestions[quizIdx];const ok=idx===q.correct;if(ok)quizOk++;q.options.forEach((_,i)=>{const el=document.getElementById('opt'+i);el.classList.add('disabled');if(i===q.correct)el.classList.add('correct');else if(i===idx&&!ok)el.classList.add('wrong')});showFB(ok,q.explain);updateDot(quizIdx,ok)}
function answerVF(val){if(quizAnswered)return;quizAnswered=true;const q=quizQuestions[quizIdx];const ok=val===q.correct;if(ok)quizOk++;const v=document.getElementById('opt_v'),f=document.getElementById('opt_f');v.classList.add('disabled');f.classList.add('disabled');if(q.correct===true){v.classList.add('correct');if(!ok)f.classList.add('wrong')}else{f.classList.add('correct');if(!ok)v.classList.add('wrong')}showFB(ok,q.explain);updateDot(quizIdx,ok)}
function showFB(ok,explain){const el=document.getElementById('qFb');el.className='quiz-fb show '+(ok?'ok':'err');el.innerHTML=(ok?'✅ ':'❌ ')+explain;document.getElementById('qBtns').style.display='flex';document.getElementById('nxtBtn').textContent=quizIdx<quizQuestions.length-1?'Question suivante →':'Voir mon résultat 🎯'}
function updateDot(idx,ok){const dot=document.getElementById('qd'+idx);if(dot)dot.className='qdot '+(ok?'ok':'err')}
function nextQ(){quizIdx++;if(quizIdx>=quizQuestions.length)showResult();else renderQ()}
function openCourse(li){curLvl=li;document.getElementById('cLvlTag').textContent=LEVELS[li].title;document.getElementById('cTitle').textContent=LEVELS[li].title;document.getElementById('courseContent').innerHTML=LESSONS[li];document.getElementById('bubbleCourse').textContent=LEVELS[li].soon?'Ce chapitre arrive bientôt ! 🚧':'Je vais tout t\'expliquer ! 🤖';goTo('sCourse')}
function showResult(){const st=load(),ls=st.levels[curLvl];const pass=quizOk>=Math.ceil(N_Q*UNLOCK);ls.total+=N_Q;if(quizOk>ls.best)ls.best=quizOk;st.totalOk+=quizOk;if(pass&&curLvl<LEVELS.length-1)st.levels[curLvl+1].unlocked=true;const nb=[];BADGES.forEach(b=>{if(!st.badges.includes(b.id)&&st.totalOk>=b.min){st.badges.push(b.id);nb.push(b)}});save(st);const stars=quizOk>=5?3:quizOk>=4?2:quizOk>=3?1:0;document.getElementById('resStars').innerHTML=[0,1,2].map(s=>'<span>'+(s<stars?'⭐':'☆')+'</span>').join('');document.getElementById('resScore').textContent=quizOk+'/'+N_Q;document.getElementById('resSub').textContent=quizOk>=4?'bonnes réponses — Bravo !':'bonne'+(quizOk>1?'s':'')+' réponse'+(quizOk>1?'s':'');const msg=document.getElementById('resMsg');if(pass){const next=curLvl+2;msg.className='res-msg unlock';msg.innerHTML=next<=LEVELS.length?'🎉 Excellent !<br><strong>Chapitre '+next+' débloqué !</strong> 🚀':'🏆 Tous les chapitres terminés !<br><strong>Tu maîtrises les Agentic Design Patterns !</strong> 🌟'}else{msg.className='res-msg retry';msg.innerHTML='💪 Continue !<br>Tu as <strong>'+quizOk+'/'+N_Q+'</strong>. Il faut <strong>4 ou 5</strong> pour débloquer le chapitre suivant.'}const bn=document.getElementById('badgeNotif');if(nb.length>0){const b=nb[0];bn.className='badge-notif show';bn.innerHTML='<h3>'+b.icon+' Nouveau badge : '+b.label+' !</h3><p>'+st.totalOk+' bonnes réponses !</p>'}else bn.className='badge-notif';const acts=document.getElementById('resActions');acts.innerHTML='<button class="btn-purple" onclick="beginQuiz()">🔄 Refaire le quiz</button>';if(pass&&curLvl<LEVELS.length-1)acts.innerHTML+='<button class="btn-green" onclick="openCourse('+(curLvl+1)+')">➡️ Chapitre '+(curLvl+2)+'</button>';acts.innerHTML+='<button class="btn-ghost" onclick="goTo(\'sHome\');renderHome()">🏠 Retour</button>';if(quizOk>=4)confetti();goTo('sResult')}
function confetti(){const cols=['#7c4dff','#00e5ff','#ffd740','#69f0ae','#ff5252','#b388ff'];for(let i=0;i<60;i++){const el=document.createElement('div');el.className='confetti-piece';el.style.cssText='left:'+Math.random()*100+'vw;top:-10px;background:'+cols[i%cols.length]+';width:'+(6+Math.random()*8)+'px;height:'+(6+Math.random()*8)+'px;border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+(2.5+Math.random()*2)+'s;animation-delay:'+Math.random()*.8+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),5000)}}
function renderHome(){const st=load();const br=document.getElementById('badgesRow');br.innerHTML=BADGES.map(b=>'<div class="badge-item'+(st.badges.includes(b.id)?' earned':'')+'" data-b="'+b.id+'"><div class="badge-icon">'+b.icon+'</div><div class="badge-label">'+b.label+'</div></div>').join('');const pct=Math.min(100,Math.round(st.totalOk/TOTAL_Q*100));document.getElementById('gpFill').style.width=pct+'%';document.getElementById('gpCount').textContent=st.totalOk+' / '+TOTAL_Q;document.getElementById('levelsGrid').innerHTML=LEVELS.map((lv,i)=>{const ls=st.levels[i];let cls;if(lv.soon&&!ls.unlocked)cls='soon';else if(!ls.unlocked)cls='locked';else if(ls.best>=Math.ceil(N_Q*UNLOCK))cls='completed';else cls='unlocked';const stars=ls.total>0?[0,1,2].map(s=>s<starsFor(ls.best)?'⭐':'☆').join(''):'';const icon=lv.soon&&!ls.unlocked?'🏗️':!ls.unlocked?'🔒':cls==='completed'?'✅':'▶️';return'<div class="level-card '+cls+'" onclick="'+(cls!=='locked'&&cls!=='soon'?'openCourse('+i+')':'')+'"><div class="lv-num">'+lv.icon+'</div><div class="lv-info"><div class="lv-title">'+lv.title+'</div><div class="lv-desc">'+lv.desc+'</div>'+(stars?'<div class="lv-stars">'+stars+'</div>':'')+'</div><div class="lv-status">'+icon+'</div></div>'}).join('')}
function starsFor(best){return best>=5?3:best>=4?2:best>=3?1:0}
function goTo(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('DOMContentLoaded',renderHome);
</script>
</body>
</html>
